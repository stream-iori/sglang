[package]
name = "my-smg"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
    "io-util",
] }
url = "2"
