[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-sglang"
version = "0.1.0"
description = "带 NumPy Transformer 闭环的最小 SGLang 风格 CPU 学习运行时。"
requires-python = ">=3.13"
dependencies = [
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1",
]

[project.scripts]
my-sglang-generate = "my_sglang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../python"]
addopts = "-q"
